<!doctype html>
<html lang="en">

<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy"
  content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src https://api.aladhan.com https://countriesnow.space; img-src 'self' data:; font-src 'self';">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hudhud</title>
<script src="./theme-init.js"></script>
<link rel="stylesheet" href="./main.css" />

</head>

<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-title">
          <img class="brand-logo" src="../assets/logo.png" alt="" aria-hidden="true" />
          <h1>Hudhud</h1>
          <span id="app-version" class="app-version" role="button" tabindex="0" title="View release notes"
            hidden></span>
          <span id="dev-badge" class="dev-badge" hidden>Dev</span>
        </div>
        <p class="subtitle">Prayer times tuned to your location.</p>
      </div>
      <div class="topbar-actions">
        <button id="update-action" class="update-action" type="button" hidden></button>
      </div>
    </header>

    <nav class="main-tabs" role="tablist" aria-label="Hudhud sections">
      <button class="main-tab active" type="button" role="tab" aria-controls="prayer-tab-panel" aria-selected="true"
        data-main-tab="prayer">Prayer</button>
      <button class="main-tab" type="button" role="tab" aria-controls="azkar-tab-panel" aria-selected="false"
        data-main-tab="azkar">Azkar</button>
    </nav>

    <section id="prayer-tab-panel" class="tab-panel">
      <div id="prayer-banner" class="prayer-banner" hidden>
        <p id="prayer-banner-text" class="prayer-banner-text"></p>
        <button id="prayer-banner-confirm" class="prayer-banner-confirm" type="button">I prayed</button>
      </div>

      <section class="layout" aria-live="polite">
        <form id="settings-form" class="form-pane" novalidate>
          <div class="section-title">
            <button id="settings-back-action" class="settings-back-action" type="button"
              aria-label="Back to prayer times" title="Back to prayer times" hidden>
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="M19 12H5"></path>
                <path d="m12 19-7-7 7-7"></path>
              </svg>
            </button>
            <h2 id="form-title">Prayer Times Setup</h2>
          </div>

          <div class="stepper" aria-label="Setup steps">
            <span id="location-step-chip" class="step-chip active">1. Location</span>
            <span id="calculation-step-chip" class="step-chip">2. Calculation</span>
          </div>

          <div class="settings-tabs" role="tablist" aria-label="Settings sections" hidden>
            <button id="settings-tab-general" class="settings-tab active" type="button" role="tab"
              aria-controls="general-step" data-settings-tab="general">General</button>
            <button id="settings-tab-location" class="settings-tab" type="button" role="tab"
              aria-controls="location-step" data-settings-tab="location">Location</button>
            <button id="settings-tab-calculation" class="settings-tab" type="button" role="tab"
              aria-controls="calculation-step" data-settings-tab="calculation">Calculation</button>
          </div>

          <label id="settings-preview-toggle-row" class="toggle-option settings-preview-toggle" hidden>
            <span class="toggle-copy">
              <strong>Show preview</strong>
              <span class="hint">Compare prayer times before returning to the dashboard.</span>
            </span>
            <input id="settings-preview-toggle" type="checkbox" />
          </label>

          <div class="form-grid">
            <section id="location-step" class="step-panel active">
              <label>
                Country
                <input id="country-select" name="country" list="country-options" autocomplete="country-name" required
                  placeholder="Loading countries..." />
                <datalist id="country-options"></datalist>
              </label>

              <label id="state-field" hidden>
                State / Province
                <input id="state-select" name="state" list="state-options" autocomplete="address-level1"
                  placeholder="Choose a country first" />
                <datalist id="state-options"></datalist>
              </label>

              <label id="city-field" hidden>
                City
                <input id="city-select" name="city" list="city-options" autocomplete="address-level2" required disabled
                  placeholder="Choose a country first" />
                <datalist id="city-options"></datalist>
                <span id="city-hint" class="hint">Cities appear after you choose a country.</span>
              </label>
            </section>

            <section id="calculation-step" class="step-panel">
              <label>
                Calculation method
                <input id="method-select" name="method" list="method-options" autocomplete="off" />
                <datalist id="method-options"></datalist>
              </label>

              <label>
                Asr school
                <span class="segmented" role="group" aria-label="Asr school">
                  <button class="segment active" type="button" data-school="0">Standard</button>
                  <button class="segment" type="button" data-school="1">Hanafi</button>
                </span>
              </label>

              <details>
                <summary>Advanced calculation settings</summary>
                <div class="advanced-grid">
                  <label>
                    High latitude
                    <input id="latitude-select" name="latitudeAdjustmentMethod" list="latitude-options"
                      autocomplete="off" />
                    <datalist id="latitude-options"></datalist>
                  </label>

                  <label>
                    Shafaq
                    <input id="shafaq-select" name="shafaq" list="shafaq-options" autocomplete="off" disabled />
                    <datalist id="shafaq-options"></datalist>
                    <span class="hint">Used only with Moonsighting Committee.</span>
                  </label>

                  <div class="offsets" aria-label="Minute offsets">
                    <label>Fajr <input id="offset-fajr" type="number" min="-30" max="30" step="1" value="0" /></label>
                    <label>Dhuhr <input id="offset-dhuhr" type="number" min="-30" max="30" step="1" value="0" /></label>
                    <label>Asr <input id="offset-asr" type="number" min="-30" max="30" step="1" value="0" /></label>
                    <label>Maghrib <input id="offset-maghrib" type="number" min="-30" max="30" step="1"
                        value="0" /></label>
                    <label>Isha <input id="offset-isha" type="number" min="-30" max="30" step="1" value="0" /></label>
                  </div>
                </div>
              </details>
            </section>

            <section id="general-step" class="step-panel">
              <label class="toggle-option">
                <span class="toggle-copy">
                  <strong>Launch at startup</strong>
                  <span class="hint">Start Hudhud with your computer.</span>
                </span>
                <input id="launch-at-startup" type="checkbox" />
              </label>

              <label class="toggle-option">
                <span class="toggle-copy">
                  <strong>Keep pet on top</strong>
                  <span class="hint">Keep the pet above regular windows.</span>
                </span>
                <input id="pet-always-on-top" type="checkbox" />
              </label>

              <label>
                Theme
                <span class="segmented theme-segmented" role="group" aria-label="Theme">
                  <button class="segment active" type="button" data-theme-value="system"
                    aria-pressed="true">System</button>
                  <button class="segment" type="button" data-theme-value="light" aria-pressed="false">Light</button>
                  <button class="segment" type="button" data-theme-value="dark" aria-pressed="false">Dark</button>
                </span>
              </label>

            </section>

            <p id="form-error" class="error"></p>

            <div class="actions">
              <button id="primary-action" class="button primary" type="submit">Continue</button>
              <button id="back-action" class="button secondary" type="button">Back</button>
              <button id="reset-action" class="button secondary" type="button">Reset</button>
            </div>
          </div>
        </form>

        <section id="preview-pane" class="preview-pane"></section>
      </section>
    </section>

    <section id="azkar-tab-panel" class="tab-panel" hidden>
      <section class="azkar-shell" aria-live="polite">
        <div id="azkar-toolbar" class="azkar-toolbar" hidden>
          <button id="azkar-back-action" class="azkar-back-action" type="button"
            aria-label="Back to azkar home" title="Back to azkar home">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M19 12H5"></path>
              <path d="m12 19-7-7 7-7"></path>
            </svg>
          </button>
        </div>
        <div id="azkar-list" class="azkar-list"></div>
      </section>
    </section>
  </main>

  <dialog id="reset-confirm-dialog" class="confirm-dialog">
    <h2>Reset to defaults?</h2>
    <p>All your settings will be cleared and you'll restart setup from scratch.</p>
    <div class="confirm-dialog-actions">
      <button id="reset-cancel-action" class="button secondary" type="button">Cancel</button>
      <button id="reset-confirm-action" class="button danger" type="button">Reset</button>
    </div>
  </dialog>

  <dialog id="release-notes-dialog" class="release-notes-dialog">
    <section class="release-notes-shell" aria-labelledby="release-notes-title">
      <div class="release-notes-header">
        <div>
          <h2 id="release-notes-title">Release notes</h2>
        </div>
        <div class="release-notes-header-actions">
          <button id="release-notes-github" class="release-notes-github" type="button"
            aria-label="Open GitHub repository in browser" title="Open GitHub repository in browser">
            GitHub
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"
              stroke-linejoin="round">
              <path d="M7 17 17 7" />
              <path d="M9 7h8v8" />
            </svg>
          </button>
          <button id="release-notes-close" class="release-notes-close" type="button"
            aria-label="Close release notes">&times;</button>
        </div>
      </div>
      <div class="release-notes-content">
        <p id="release-notes-status" class="release-notes-status" aria-live="polite"></p>
        <div id="release-notes-list" class="release-notes-list"></div>
      </div>
    </section>
  </dialog>

  <aside class="feedback-widget" aria-label="Feedback">
    <section id="feedback-panel" class="feedback-panel" hidden>
      <div class="feedback-panel-header">
        <div>
          <h2>Send feedback</h2>
          <p class="hint">Tell us what to fix or improve.</p>
        </div>
        <button id="feedback-close" class="feedback-close" type="button"
          aria-label="Close feedback form">&times;</button>
      </div>
      <form id="feedback-form" class="feedback-form" novalidate>
        <label>
          <span>Email <span class="hint">(optional)</span></span>
          <input id="feedback-email" name="email" type="email" autocomplete="email" />
        </label>
        <label>
          Feedback
          <textarea id="feedback-message" name="feedback" required maxlength="2000"></textarea>
        </label>
        <p id="feedback-status" class="feedback-status" aria-live="polite"></p>
        <button id="feedback-submit" class="button primary" type="submit">Send feedback</button>
      </form>
    </section>
    <button id="feedback-toggle" class="feedback-toggle" type="button" aria-expanded="false"
      aria-controls="feedback-panel">Feedback</button>
  </aside>
  <script src="./app.js"></script>
</body>

</html>
